[package]
name = "openidea-svn"
version = "0.1.9"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = { version = "0.38", features = ["serialize"] }
openidea-plugin = { path = "vendor/openidea-plugin" }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
opt-level = "s"
strip = true
