name: Publish signed SVN release
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/publish-release.yml
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'hdpsowk-rgb/openidea-svn'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and publish signed 0.1.6 package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset=".release-upload/hdpsowk-rgb.svn-0.1.6.oiplugin"
          echo "5a7cebf595614276ae49227ec928edfeeb8ec55470064cbf852b147e5c58b3e5  $asset" | sha256sum --check
          if gh release view v0.1.6 >/dev/null 2>&1; then
            echo "Release v0.1.6 already exists; refusing to replace its assets."
            exit 1
          fi
          gh release create v0.1.6 "$asset" --target 3f67f2df09fe8cc9e65b0fcb8f06a4bb84eab35e --title "SVN 0.1.6 for OpenIDEA" --notes-file .release-upload/notes.md
